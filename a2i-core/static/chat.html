<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2I — Personal AI</title>
<style>
  :root {
    --bg: #0f1117; --panel: #1a1d27; --text: #e8eaf0;
    --muted: #9aa0b0; --accent: #6c8cff; --user: #2a3350;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fa; --panel: #ffffff; --text: #1a1d27;
      --muted: #6b7180; --accent: #3b5bdb; --user: #e3e9ff;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Noto Sans Khmer", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 0.9rem 1.2rem; background: var(--panel);
    border-bottom: 1px solid rgba(128,128,128,.2);
    display: flex; align-items: center; gap: .6rem;
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #3ecf8e; }
  header h1 { font-size: 1rem; font-weight: 600; }
  header span { color: var(--muted); font-size: .8rem; margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 1.2rem; display: flex; flex-direction: column; gap: .8rem; }
  .msg { max-width: 46rem; padding: .7rem 1rem; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: var(--user); align-self: flex-end; }
  .ai { background: var(--panel); align-self: flex-start; border: 1px solid rgba(128,128,128,.15); }
  form { display: flex; gap: .6rem; padding: 1rem 1.2rem; background: var(--panel); border-top: 1px solid rgba(128,128,128,.2); }
  input {
    flex: 1; padding: .7rem 1rem; border-radius: 10px; font-size: 1rem;
    border: 1px solid rgba(128,128,128,.3); background: var(--bg); color: var(--text);
  }
  button {
    padding: .7rem 1.3rem; border: 0; border-radius: 10px; font-size: 1rem;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>A2I — Personal AI</h1>
  <span>100% local · no external APIs</span>
</header>
<div id="log"></div>
<form id="form">
  <input id="input" placeholder="Ask anything… / សួរអ្វីក៏បាន…" autocomplete="off" autofocus>
  <button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const history = [];

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send.disabled = true;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  const aiDiv = addMsg('ai', '…');

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, stream: true, max_tokens: 1024 }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let answer = '', buffer = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        const delta = JSON.parse(line.slice(6)).choices?.[0]?.delta?.content;
        if (delta) { answer += delta; aiDiv.textContent = answer; log.scrollTop = log.scrollHeight; }
      }
    }
    history.push({ role: 'assistant', content: answer });
  } catch (err) {
    aiDiv.textContent = 'Error: ' + err.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>

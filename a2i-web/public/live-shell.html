
<div class="bg"></div>
<div class="grid"></div>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo">A2</div>
      <div>A2I Live</div>
    </div>
    <div class="spacer"></div>
    <button id="lang" class="pill" title="Voice language"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg> <span id="lang-label">EN</span></button>
    <button id="autolisten" class="pill" title="Hands-free: keep listening"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Auto</button>
    <button id="gemini-btn" class="pill" title="Use your Gemini API key"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z"/></svg> <span id="gemini-label">Gemini</span></button>
    <a class="pill" href="/" title="Classic chat"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> <span data-i18n="hpNavChat">Chat</span></a>
  </header>

  <div class="stage">
    <div class="halo"></div>
    <canvas class="viz" id="viz"></canvas>
    <div class="status-chip" id="status" data-i18n="liveCaption">tap the mic and speak</div>
    <div class="caption user" id="cap-user"></div>

    <div class="robot">
      <spline-viewer id="spline"
        url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"></spline-viewer>
      <div class="orb-fallback"><div class="orb"></div></div>
    </div>

    <div class="caption ai md" id="cap-ai"></div>
  </div>

  <div class="controls">
    <button id="mic" class="mic" title="Push to talk"><svg class="ico ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
    <form id="form">
      <input id="input" placeholder="ឬវាយសួរ… or type to ask…" data-i18n-ph="livePh" autocomplete="off">
      <button type="submit" title="Send"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </form>
  </div>
  <div class="foot" id="foot"></div>
</div>
